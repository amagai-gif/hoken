<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>アンケート：辞められない理由</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"M PLUS Rounded 1c",sans-serif;background:#fffdf8;color:#3a3330;min-height:100vh;padding-bottom:60px;}
.hero{background:linear-gradient(135deg,#5a5a8a,#3a3a6a);padding:20px 16px 24px;text-align:center;}
.hero h1{font-size:17px;font-weight:900;color:#fff;line-height:1.3;}
.hero p{font-size:12px;color:rgba(255,255,255,.75);margin-top:4px;}
.modebar{display:flex;gap:8px;padding:12px 14px;background:#fffdf8;position:sticky;top:0;z-index:200;border-bottom:2px solid #f0ece4;}
.mbtn{flex:1;border:2.5px solid #e0dbd2;background:#fff;border-radius:40px;padding:10px 8px;font-family:inherit;font-size:13px;font-weight:800;cursor:pointer;color:#aaa;transition:all .2s;}
.mbtn.ons{background:#5a5a8a;border-color:#5a5a8a;color:#fff;}
.mbtn.ont{background:#e85d5d;border-color:#e85d5d;color:#fff;}
.pnl{display:none;padding:14px;}.pnl.show{display:block;}
.q-card{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;margin-top:12px;box-shadow:0 4px 16px rgba(0,0,0,.08);border:1.5px solid #f0ece4;}
.q-label{font-size:13px;font-weight:900;color:#5a5a8a;margin-bottom:8px;}
.q-text{font-size:16px;font-weight:900;color:#3a3330;margin-bottom:14px;line-height:1.5;}
.opts{display:flex;flex-direction:column;gap:8px;}
.opt-btn{width:100%;padding:14px 16px;border:2.5px solid #e0dbd2;background:#fff;border-radius:12px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;text-align:left;color:#888;transition:all .18s;}
.opt-btn.on{border-color:#5a5a8a;background:#eeeefc;color:#3a3a6a;}
.sbtn{width:100%;padding:15px;border:none;border-radius:16px;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;background:#5a5a8a;color:#fff;margin-top:8px;transition:all .2s;}
.sbtn:disabled{opacity:.35;cursor:default;}
.done-box{background:#eeeefc;border:2px solid #5a5a8a;border-radius:16px;padding:20px;text-align:center;display:none;margin-top:8px;}
.done-emoji{font-size:48px;display:block;margin-bottom:8px;}
.done-text{font-size:16px;font-weight:900;color:#3a3a6a;}
.done-sub{font-size:12px;color:#5a5a8a;margin-top:4px;}
/* 教員モード */
.rfbtn{border:2px solid #5a5a8a;background:#eeeefc;color:#3a3a6a;border-radius:30px;padding:7px 14px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;margin-bottom:12px;}
.rstbtn{border:2px solid #e85d5d;background:#fde8e8;color:#c0392b;border-radius:30px;padding:7px 14px;font-family:inherit;font-size:12px;font-weight:800;cursor:pointer;margin-bottom:12px;margin-left:8px;}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chip{background:#fff;border:1.5px solid #f0ece4;border-radius:30px;padding:5px 12px;font-size:12px;font-weight:800;color:#888;}
.chart-section{background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;border:1.5px solid #f0ece4;box-shadow:0 2px 10px rgba(0,0,0,.06);}
.chart-title{font-size:14px;font-weight:900;margin-bottom:12px;color:#3a3330;}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:9px;}
.bar-label{font-size:13px;font-weight:700;color:#3a3330;min-width:130px;flex-shrink:0;line-height:1.3;}
.bar-wrap{flex:1;background:#f0ece4;border-radius:999px;height:32px;overflow:hidden;}
.bar-fill{height:100%;border-radius:999px;display:flex;align-items:center;padding-left:10px;transition:width .6s ease;min-width:0;}
.bar-fill span{font-size:12px;font-weight:900;color:#fff;white-space:nowrap;}
.bar-pct{font-size:13px;font-weight:900;min-width:40px;text-align:right;color:#5a5a8a;}
.empty{text-align:center;padding:30px;color:#ccc;font-size:14px;font-weight:700;}
.note{font-size:12px;color:#888;text-align:center;margin-top:8px;font-style:italic;}
</style>
</head>
<body>
<div class="hero">
  <h1>個人アンケート<br>辞めたくても辞められない理由</h1>
  <p>自分が一番「わかる！」と思うものを選んで送信してね</p>
</div>
<div class="modebar">
  <button class="mbtn ons" id="mb-s" onclick="setMode('s')">🙋 生徒モード</button>
  <button class="mbtn" id="mb-t" onclick="setMode('t')">📊 集計モード</button>
</div>

<div class="pnl show" id="pnl-s">
  <div class="q-card">
    <div class="q-label">Q1　個人で答えよう</div>
    <div class="q-text">仕事を辞めたくても辞められない理由、自分が一番「わかる！」と思うものは？</div>
    <div class="opts">
      <button class="opt-btn" onclick="pick(this,'💴 生活できなくなる不安')">💴　生活できなくなる不安</button>
      <button class="opt-btn" onclick="pick(this,'😰 転職できるか・仕事が見つかるか不安')">😰　転職できるか・仕事が見つかるか不安</button>
      <button class="opt-btn" onclick="pick(this,'💰 今の給料・待遇が良い')">💰　今の給料・待遇が良い</button>
      <button class="opt-btn" onclick="pick(this,'❤️ 仕事が好き・やりがいがある')">❤️　仕事が好き・やりがいがある</button>
    </div>
    <button class="sbtn" id="submit-btn" onclick="submitAnswer()" disabled>回答を送信する</button>
    <div class="done-box" id="done-box">
      <span class="done-emoji">✅</span>
      <div class="done-text">送信完了！ありがとう！</div>
      <div class="done-sub">集計モードでクラスの結果を確認してみよう</div>
    </div>
  </div>
  <p class="note">※ 正解はありません。自分の正直な気持ちを選んでください</p>
</div>

<div class="pnl" id="pnl-t">
  <div style="height:12px"></div>
  <div>
    <button class="rfbtn" onclick="loadResults()">🔄 最新の集計を見る</button>
    <button class="rstbtn" onclick="resetData()">🗑️ リセット</button>
  </div>
  <div class="stats" id="stat-box"></div>
  <div id="charts"><div class="empty">🔄 更新ボタンを押すと結果が表示されます</div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyCgA-yqynPM-ezZpBZCp8DLrxN9R82zS5U",authDomain:"hoken-app-26315.firebaseapp.com",databaseURL:"https://hoken-app-26315-default-rtdb.firebaseio.com",projectId:"hoken-app-26315",storageBucket:"hoken-app-26315.firebasestorage.app",messagingSenderId:"932877641447",appId:"1:932877641447:web:a351fa878ed76ae4392442"};
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

const COLORS={"💴 生活できなくなる不安":"#5a5a8a","😰 転職できるか・仕事が見つかるか不安":"#e85d5d","💰 今の給料・待遇が良い":"#f0c060","❤️ 仕事が好き・やりがいがある":"#3dba7f"};
let selected=null;
let submitted=false;

window.setMode=function(m){
  document.getElementById("mb-s").className="mbtn"+(m==="s"?" ons":"");
  document.getElementById("mb-t").className="mbtn"+(m==="t"?" ont":"");
  document.getElementById("pnl-s").classList.toggle("show",m==="s");
  document.getElementById("pnl-t").classList.toggle("show",m==="t");
  if(m==="t") loadResults();
};

window.pick=function(btn,val){
  if(submitted) return;
  document.querySelectorAll(".opt-btn").forEach(b=>b.classList.remove("on"));
  btn.classList.add("on");
  selected=val;
  document.getElementById("submit-btn").disabled=false;
};

window.submitAnswer=async function(){
  if(!selected||submitted) return;
  submitted=true;
  document.getElementById("submit-btn").disabled=true;
  const id="u_"+Date.now()+"_"+Math.random().toString(36).slice(2,7);
  try{
    await set(ref(db,"survey8v2/responses/"+id),{answer:selected,ts:Date.now()});
    document.getElementById("submit-btn").style.display="none";
    document.getElementById("done-box").style.display="block";
  }catch(e){
    submitted=false;
    document.getElementById("submit-btn").disabled=false;
    alert("送信に失敗しました。もう一度試してください。");
  }
};

window.loadResults=async function(){
  const el=document.getElementById("charts");
  el.innerHTML="<div class='empty'>読み込み中…</div>";
  try{
    const snap=await get(ref(db,"survey8v2/responses"));
    const data=snap.val()||{};
    const responses=Object.values(data);
    const total=responses.length;
    document.getElementById("stat-box").innerHTML=`<div class="chip">回答数 <b style="color:#5a5a8a">${total}</b> 人</div><div class="chip">未回答 <b style="color:#e85d5d">${Math.max(0,36-total)}</b> 人</div>`;
    if(total===0){el.innerHTML="<div class='empty'>まだ回答がありません</div>";return;}
    const counts={};
    responses.forEach(r=>{counts[r.answer]=(counts[r.answer]||0)+1;});
    let html=`<div class="chart-section"><div class="chart-title">辞められない理由　クラスの集計結果（${total}人）</div>`;
    Object.entries(counts).sort((a,b)=>b[1]-a[1]).forEach(([label,cnt])=>{
      const pct=Math.round(cnt/total*100);
      const color=COLORS[label]||"#aaa";
      html+=`<div class="bar-row"><div class="bar-label">${label}</div><div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${color};"><span>${cnt}人</span></div></div><div class="bar-pct">${pct}%</div></div>`;
    });
    html+="</div>";
    el.innerHTML=html;
  }catch(e){el.innerHTML="<div class='empty' style='color:#e85d5d;'>読み込みに失敗しました</div>";}
};

window.resetData=async function(){
  if(!confirm("全回答データを削除します。よろしいですか？")) return;
  try{
    await set(ref(db,"survey8v2/responses"),null);
    document.getElementById("stat-box").innerHTML="";
    document.getElementById("charts").innerHTML="<div class='empty' style='color:#3dba7f;'>✓ リセットしました！</div>";
  }catch(e){alert("リセットに失敗しました。");}
};
</script>
</body>
</html>
