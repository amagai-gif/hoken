<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授業前クイズ：医療制度とその活用</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#1a1a1a;min-height:100vh;padding:1rem;font-family:"Hiragino Kaku Gothic ProN","Meiryo",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.app{background:#0d0d0d;width:100%;max-width:960px;min-height:520px;border-radius:16px;padding:2.5rem 3rem;display:flex;flex-direction:column;position:relative;overflow:hidden;color:#fff;box-shadow:0 8px 32px rgba(0,0,0,.5);}
.slide-num{position:absolute;top:1.25rem;right:1.5rem;font-size:14px;color:#555;}
.q-tag{display:inline-block;font-size:13px;font-weight:700;padding:5px 16px;border-radius:20px;margin-bottom:1.25rem;background:#1a1a2a;color:#f0c060;}
.q-text{font-size:28px;font-weight:700;color:#fff;line-height:1.5;white-space:pre-line;margin-bottom:2rem;flex:1;}
.intro-badge{display:inline-block;font-size:13px;font-weight:700;padding:5px 16px;border-radius:20px;margin-bottom:1.25rem;background:#1a1a2a;color:#f0c060;}
.intro-title{font-size:32px;font-weight:700;color:#fff;line-height:1.45;margin-bottom:0.6rem;}
.intro-sub{font-size:20px;color:#aaa;line-height:1.6;}
.btn-row{display:flex;gap:16px;margin-top:auto;}
.ans-btn{flex:1;padding:20px 12px;border:2.5px solid;border-radius:14px;font-family:inherit;font-size:24px;font-weight:700;cursor:pointer;transition:all .15s;text-align:center;background:transparent;}
.btn-o{border-color:#2a6e4a;color:#4ecb87;}
.btn-x{border-color:#7a2020;color:#f07070;}
.btn-o:hover:not(:disabled){background:#1a3d2a;}
.btn-x:hover:not(:disabled){background:#3a1010;}
.ans-btn:disabled{opacity:.3;cursor:default;}
.big-answer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:16px;z-index:10;opacity:0;pointer-events:none;}
.big-answer.show{opacity:1;pointer-events:auto;}
.big-mark{font-size:160px;font-weight:700;line-height:1;}
.anim-pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes pop{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}
.bg-ok{background:#0a2a18;}.bg-ng{background:#2a0a0a;}
.col-ok{color:#4ecb87;}.col-ng{color:#f07070;}
.explain-box{position:absolute;inset:0;border-radius:16px;padding:2.5rem 3rem;display:flex;flex-direction:column;justify-content:center;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;}
.explain-box.show{opacity:1;pointer-events:auto;}
.explain-mark{font-size:72px;font-weight:700;line-height:1;margin-bottom:1rem;}
.explain-text{font-size:22px;font-weight:700;line-height:1.75;white-space:pre-line;color:#fff;}
.explain-hint{font-size:15px;color:#555;margin-top:1.75rem;}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:1.25rem;width:100%;max-width:960px;}
.nav-btn{border:1px solid #333;background:#1a1a1a;border-radius:8px;padding:12px 28px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;color:#aaa;transition:all .15s;}
.nav-btn:hover{background:#2a2a2a;color:#fff;}
.nav-btn:disabled{opacity:.25;cursor:default;}
.dots-wrap{display:flex;flex-direction:column;align-items:center;gap:5px;}
.dots{display:flex;gap:5px;flex-wrap:wrap;max-width:260px;justify-content:center;}
.dot{width:9px;height:9px;border-radius:50%;background:#333;flex-shrink:0;transition:background .2s;}
.dot.cur{background:#f0c060;}.dot.done-ok{background:#4ecb87;}.dot.done-ng{background:#f07070;}
.prog{font-size:12px;color:#555;}
#celebrate{position:fixed;inset:0;z-index:1000;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);}
#celebrate.show{display:flex;}
#celebrate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.celeb-msg{position:relative;z-index:10;text-align:center;animation:celebIn .6s cubic-bezier(.2,1.4,.4,1) both;}
@keyframes celebIn{from{transform:scale(.3);opacity:0;}to{transform:scale(1);opacity:1;}}
.celeb-emoji{font-size:80px;display:block;margin-bottom:.5rem;animation:bounce 1s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-15px);}}
.celeb-title{font-size:48px;font-weight:700;color:#f0c060;text-shadow:0 0 30px rgba(240,192,96,.8);margin-bottom:.4rem;}
.celeb-sub{font-size:22px;color:#fff;margin-bottom:2rem;}
.celeb-close{border:2px solid #f0c060;background:transparent;color:#f0c060;border-radius:12px;padding:12px 36px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;}
.celeb-close:hover{background:#f0c060;color:#000;}
.res-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
.res-emoji{font-size:80px;margin-bottom:.5rem;animation:bounce 1s ease-in-out infinite;}
.res-score{font-size:64px;font-weight:700;color:#f0c060;line-height:1.2;}
.res-score small{font-size:28px;color:#aaa;}
.res-msg{font-size:24px;font-weight:700;color:#fff;margin:1rem 0 1.5rem;}
.res-note{font-size:16px;color:#888;}
.res-btn{border:2px solid #f0c060;background:transparent;color:#f0c060;border-radius:12px;padding:12px 32px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;margin:0 6px;}
.res-btn:hover{background:#f0c060;color:#000;}
@media (max-width:820px){
  body{padding:.6rem;justify-content:flex-start;}
  .app{padding:1.6rem 1.4rem;min-height:440px;}
  .q-text{font-size:22px;margin-bottom:1.4rem;}
  .intro-title{font-size:26px;}.intro-sub{font-size:17px;}
  .explain-box{padding:1.6rem 1.4rem;}
  .explain-text{font-size:17px;}
  .explain-mark{font-size:56px;}
  .big-mark{font-size:120px;}
  .ans-btn{font-size:22px;padding:16px 10px;}
  .nav-btn{padding:10px 18px;}
  .celeb-title{font-size:36px;}.celeb-sub{font-size:18px;}
}
</style>
</head>
<body>
<div class="app" id="app">
  <span class="slide-num" id="snum"></span>
  <div id="content" style="display:flex;flex-direction:column;flex:1;"></div>
  <div class="big-answer" id="big-answer"><div class="big-mark" id="big-mark"></div></div>
  <div class="explain-box" id="explain-box">
    <div class="explain-mark" id="explain-mark"></div>
    <div class="explain-text" id="explain-text"></div>
    <div class="explain-hint">下の「次へ →」ボタンで次の問題へ</div>
  </div>
</div>
<div class="nav">
  <button class="nav-btn" id="prev" onclick="move(-1)" disabled>← 前へ</button>
  <div class="dots-wrap">
    <div class="dots" id="dots"></div>
    <div class="prog" id="prog"></div>
  </div>
  <button class="nav-btn" id="next" onclick="move(1)">次へ →</button>
</div>
<div id="celebrate">
  <canvas id="fw-canvas"></canvas>
  <div class="celeb-msg">
    <span class="celeb-emoji">🩺</span>
    <div class="celeb-title">全問正解！！</div>
    <div class="celeb-sub">医療制度マスター🎉</div>
    <button class="celeb-close" onclick="closeCeleb()">閉じる</button>
  </div>
</div>
<script>
const SLIDES=[
  {type:"intro",title:"授業前クイズ",sub:"自分のiPadで、○か×か直感で答えてみよう！"},
  {type:"ox",q:"日本では、病院の窓口で払うお金は\nかかった医療費の「全部」だ",ans:"x",
   explain:"窓口で払うのは、多くの人は医療費の3割だけ。\n残りの7割は、みんなで出し合った保険料などから払われます。\nさらに「高額療養費制度」で1か月の支払いに上限があり\n30万円の治療でも、平均的な収入の家庭なら約8万6千円で済みます。"},
  {type:"ox",q:"日本では\n国民のだれもが、公的な医療保険に\n入るしくみになっている",ans:"o",
   explain:"1961年から「国民皆保険」といって\nすべての国民が公的な医療保険に入るしくみになりました。\nだから、だれでも少ない負担で医療を受けられます。"},
  {type:"ox",q:"アメリカも日本と同じように\n国民全員が入る\n公的な医療保険がある",ans:"x",
   explain:"アメリカには、全員が入る公的な医療保険はありません。\n民間の保険に入っていない人もいて\n病気になると、とても高いお金がかかることがあります。"},
  {type:"ox",q:"紹介状を持たずに、いきなり大きな病院を受診すると\n追加の料金がかかることがある",ans:"o",
   explain:"大学病院など大きな病院に紹介状なしで行くと\n初診で7,000円以上の特別な料金がかかります。\n「まずは身近なかかりつけ医へ」というしくみです。"},
  {type:"ox",q:"日本では\n救急車を呼ぶのにお金はかからない",ans:"o",
   explain:"救急車を呼ぶこと自体は、今も無料です。\nただし茨城県では2024年12月から、緊急性がないのに\n大きな病院に運ばれた人は、病院で特別な料金を払うことがあります。"},
  {type:"ox",q:"ベッド（入院用）が20床以上あるのが「病院」\nそれより少ないのが「診療所（クリニック）」だ",ans:"o",
   explain:"入院用のベッドが20床以上なら「病院」\n19床以下か、ベッドがなければ「診療所」です。\n名前に「医院」「クリニック」とつくのは診療所が多いです。"},
  {type:"ox",q:"献血は\n18歳（成人）にならないとできない",ans:"x",
   explain:"200mLの献血は16歳からできます。\n400mLは男性17歳・女性18歳から。\n高3のみんなは、もう献血できる年齢です。"},
  {type:"ox",q:"輸血に使う血液は\n工場で人工的に作ることができる",ans:"x",
   explain:"医療に使う血液は、今も人の血液でなければなりません。\n日本では、ほぼすべてを献血でまかなっています。\nだから献血はとても大切なのです。"},
  {type:"ox",q:"臓器を提供するかどうかの意思は\n保険証や運転免許証、マイナンバーカードにも\n書いておくことができる",ans:"o",
   explain:"保険証・運転免許証・マイナンバーカードには\n臓器提供の意思を書く欄があります。\n「提供する」も「提供しない」も、どちらも大切な意思です。"},
  {type:"ox",q:"お医者さんに「ほかの病院の先生の意見も聞きたい」と\n言うのは失礼なので、してはいけない",ans:"x",
   explain:"別の医師の意見を聞くことを「セカンド・オピニオン」といい\n安心して治療を受けるための大切な方法です。\n失礼なことではありません。"},
  {type:"result"},
];
const TOTAL_Q=SLIDES.filter(s=>s.type==="ox").length;
let cur=0;
const chosen=new Array(SLIDES.length).fill(null);
let fwAnim=null;
function launchFireworks(){
  const canvas=document.getElementById("fw-canvas");
  const ctx=canvas.getContext("2d");
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const particles=[];
  const COLORS=["#f0c060","#ffd700","#4ecb87","#60b8ff","#a89ef5","#ff9060","#fff"];
  function burst(x,y){const color=COLORS[Math.floor(Math.random()*COLORS.length)];for(let i=0;i<80;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*6;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,decay:.012+Math.random()*.01,size:2+Math.random()*4,color});}}
  for(let i=0;i<6;i++)setTimeout(()=>burst(100+Math.random()*(canvas.width-200),80+Math.random()*(canvas.height*.5)),i*180);
  let bc=0;const bi=setInterval(()=>{burst(100+Math.random()*(canvas.width-200),60+Math.random()*(canvas.height*.55));bc++;if(bc>20)clearInterval(bi);},400);
  function loop(){ctx.fillStyle="rgba(0,0,0,0.18)";ctx.fillRect(0,0,canvas.width,canvas.height);for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.08;p.vx*=.98;p.life-=p.decay;if(p.life<=0){particles.splice(i,1);continue;}ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;fwAnim=requestAnimationFrame(loop);}
  loop();
}
function showCeleb(){if(fwAnim)cancelAnimationFrame(fwAnim);document.getElementById("celebrate").classList.add("show");launchFireworks();}
function closeCeleb(){document.getElementById("celebrate").classList.remove("show");if(fwAnim)cancelAnimationFrame(fwAnim);}
function checkAll(){const qs=SLIDES.map((s,i)=>s.type==="ox"?i:-1).filter(i=>i>=0);if(!qs.every(i=>chosen[i]!==null))return;if(qs.every(i=>SLIDES[i].ans===chosen[i]))setTimeout(showCeleb,600);}
function getDisplay(s,v){return s.ans===v?{sym:"○",bg:"bg-ok",col:"col-ok"}:{sym:"×",bg:"bg-ng",col:"col-ng"};}
function isOk(s,v){return v!==null&&s.ans===v;}
function showAnswer(v){
  const s=SLIDES[cur];chosen[cur]=v;
  const d=getDisplay(s,v);
  const ba=document.getElementById("big-answer");
  ba.className="big-answer "+d.bg+" show";
  const bm=document.getElementById("big-mark");
  const nb=bm.cloneNode(false);nb.className="big-mark anim-pop "+d.col;nb.textContent=d.sym;
  bm.parentNode.replaceChild(nb,bm);
  setTimeout(()=>{
    ba.className="big-answer";
    const eb=document.getElementById("explain-box");
    eb.className="explain-box "+d.bg+" show";
    document.getElementById("explain-mark").className="explain-mark "+d.col;
    document.getElementById("explain-mark").textContent=d.sym;
    document.getElementById("explain-text").textContent=s.explain;
    renderDots();
  },900);
}
function renderDots(){
  const qs=SLIDES.map((s,i)=>s.type==="ox"?i:-1).filter(i=>i>=0);
  document.getElementById("dots").innerHTML=qs.map(i=>{let c="dot";if(i===cur)c+=" cur";else if(chosen[i]!==null)c+=isOk(SLIDES[i],chosen[i])?" done-ok":" done-ng";return`<div class="${c}"></div>`;}).join("");
}
function render(){
  const s=SLIDES[cur];
  document.getElementById("snum").textContent=`${cur+1} / ${SLIDES.length}`;
  document.getElementById("prev").disabled=cur===0;
  document.getElementById("next").disabled=cur===SLIDES.length-1;
  const qN=SLIDES.slice(0,cur+1).filter(x=>x.type==="ox").length;
  document.getElementById("prog").textContent=s.type==="ox"?`Q${qN} / ${TOTAL_Q}`:(s.type==="result"?"結果発表":"← → で進む");
  document.getElementById("big-answer").className="big-answer";
  const eb=document.getElementById("explain-box");
  if(chosen[cur]!==null&&s.type==="ox"){
    const d=getDisplay(s,chosen[cur]);
    eb.className="explain-box "+d.bg+" show";
    document.getElementById("explain-mark").className="explain-mark "+d.col;
    document.getElementById("explain-mark").textContent=d.sym;
    document.getElementById("explain-text").textContent=s.explain;
  }else{eb.className="explain-box";}
  renderDots();
  let html="";
  if(s.type==="result"){
    const qs=SLIDES.map((x,i)=>x.type==="ox"?i:-1).filter(i=>i>=0);
    const answered=qs.filter(i=>chosen[i]!==null).length;
    const ok=qs.filter(i=>isOk(SLIDES[i],chosen[i])).length;
    let emoji="📖",msg="教科書を読んで、もう一度チャレンジ！";
    if(ok===TOTAL_Q){emoji="🎉";msg="全問正解！すばらしい！";}
    else if(ok>=8){emoji="😊";msg="すごい！あと少しで満点！";}
    else if(ok>=6){emoji="🙂";msg="なかなかいい！";}
    const note=answered<TOTAL_Q?`<div class="res-note">まだ答えていない問題が ${TOTAL_Q-answered} 問あります</div>`:"";
    const again=ok===TOTAL_Q?`<button class="res-btn" onclick="showCeleb()">🎆 もう一度お祝い</button>`:"";
    html=`<div class="res-wrap"><div class="res-emoji">${emoji}</div><div class="res-score">${ok}<small> / ${TOTAL_Q} 問正解</small></div><div class="res-msg">${msg}</div>${note}<div style="margin-top:1rem;">${again}<button class="res-btn" onclick="retry()">🔄 最初からやり直す</button></div></div>`;
    document.getElementById("content").innerHTML=html;
    if(ok===TOTAL_Q&&!celebDone){celebDone=true;setTimeout(showCeleb,500);}
    return;
  }
  if(s.type==="intro"){
    html=`<div class="intro-badge">医療制度とその活用</div><div class="intro-title">${s.title}</div><div class="intro-sub">${s.sub}</div>`;
  }else{
    const lk=chosen[cur]!==null?"disabled":"";
    html=`<div class="q-tag">医療制度とその活用</div><div class="q-text">${s.q}</div><div class="btn-row"><button class="ans-btn btn-o" onclick="showAnswer('o')" ${lk}>○</button><button class="ans-btn btn-x" onclick="showAnswer('x')" ${lk}>×</button></div>`;
  }
  document.getElementById("content").innerHTML=html;
}
let celebDone=false;
function retry(){chosen.fill(null);celebDone=false;cur=0;render();}
function move(d){cur=Math.max(0,Math.min(SLIDES.length-1,cur+d));render();}
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")move(1);if(e.key==="ArrowLeft")move(-1);});
render();
</script>
</body>
</html>
