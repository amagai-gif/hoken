<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>⑨労働災害の防止 ── グループ討論</title>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--o:#ff7043;--o2:#fff3ef;--b:#29b6f6;--b2:#e3f5fd;--g:#43a047;--g2:#e8f5e9;--p:#7b2fbe;--p2:#f3e5f5;--bg:#fffdf8;--text:#3a3330;--rd:18px;}
body{font-family:"M PLUS Rounded 1c",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:100px;}
.hero{background:linear-gradient(135deg,#7b2fbe,#4a148c);padding:22px 16px 30px;text-align:center;position:relative;overflow:hidden;}
.hero::before{content:"";position:absolute;top:-40px;right:-40px;width:160px;height:160px;background:rgba(255,255,255,.1);border-radius:50%;}
.hero::after{content:"";position:absolute;bottom:-30px;left:-20px;width:100px;height:100px;background:rgba(255,255,255,.08);border-radius:50%;}
.hero-emoji{font-size:48px;display:block;margin-bottom:6px;animation:bop 2s ease-in-out infinite;}
@keyframes bop{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}
.hero h1{font-size:19px;font-weight:900;color:#fff;line-height:1.3;position:relative;}
.hero-sub{font-size:12px;color:rgba(255,255,255,.85);margin-top:5px;position:relative;}

/* Group Select */
.setup-wrap{padding:20px 16px;}
.setup-card{background:#fff;border-radius:var(--rd);padding:20px 16px;box-shadow:0 4px 20px rgba(0,0,0,.08);border:2px solid #f0ece4;}
.setup-label{font-size:14px;font-weight:800;color:#aaa;margin-bottom:10px;}
.setup-title{font-size:17px;font-weight:900;margin-bottom:16px;line-height:1.5;}
.group-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.group-btn{border:3px solid #e8e4dc;background:#fff;border-radius:14px;padding:14px 8px;font-family:inherit;font-size:22px;font-weight:900;cursor:pointer;transition:all .18s;text-align:center;color:#aaa;}
.group-btn:active{transform:scale(.95);}
.group-btn.sel{border-color:var(--p);background:var(--p2);color:var(--p);}
.start-btn{width:100%;padding:16px;border:none;border-radius:14px;font-family:inherit;font-size:16px;font-weight:900;cursor:pointer;background:var(--p);color:#fff;box-shadow:0 4px 14px rgba(123,47,190,.3);transition:all .2s;opacity:.4;pointer-events:none;}
.start-btn.active{opacity:1;pointer-events:auto;}
.start-btn:active{transform:scale(.97);}

/* Discussion */
.discuss-wrap{display:none;padding:14px 16px;}
.step-nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;}
.step-dot{width:32px;height:32px;border-radius:50%;background:#e8e4dc;font-size:13px;font-weight:900;display:flex;align-items:center;justify-content:center;color:#aaa;flex-shrink:0;cursor:pointer;transition:all .2s;}
.step-dot.done{background:var(--g);color:#fff;}
.step-dot.active{background:var(--p);color:#fff;transform:scale(1.1);}
.d-card{background:#fff;border-radius:var(--rd);padding:20px 16px;box-shadow:0 4px 20px rgba(0,0,0,.08);border:2px solid #f0ece4;display:none;}
.d-card.show{display:block;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
.d-num{display:inline-block;background:var(--p);color:#fff;font-size:12px;font-weight:900;padding:3px 10px;border-radius:20px;margin-bottom:10px;}
.d-question{font-size:16px;font-weight:900;line-height:1.6;margin-bottom:14px;}
.d-hint{background:var(--p2);border-radius:12px;padding:12px;font-size:13px;font-weight:700;line-height:1.6;color:#6a1b9a;margin-bottom:14px;}
.d-hint-title{font-size:11px;font-weight:900;color:#ab47bc;margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px;}
textarea{width:100%;border:2px solid #e8e4dc;border-radius:12px;padding:12px;font-family:inherit;font-size:14px;font-weight:700;resize:vertical;min-height:100px;color:var(--text);transition:border-color .2s;background:#fafaf8;}
textarea:focus{outline:none;border-color:var(--p);}
.char-count{text-align:right;font-size:11px;color:#bbb;font-weight:700;margin-top:3px;}
.next-btn{width:100%;margin-top:12px;padding:14px;border:none;border-radius:14px;font-family:inherit;font-size:15px;font-weight:900;cursor:pointer;background:var(--p);color:#fff;box-shadow:0 4px 14px rgba(123,47,190,.3);transition:all .2s;}
.next-btn:active{transform:scale(.97);}
.skip-btn{width:100%;margin-top:8px;padding:11px;border:none;border-radius:14px;font-family:inherit;font-size:13px;font-weight:900;cursor:pointer;background:#f0ece4;color:#aaa;transition:all .2s;}
.skip-btn:active{transform:scale(.97);}

/* Summary */
.summary-card{display:none;background:#fff;border-radius:var(--rd);padding:22px 16px;box-shadow:0 4px 20px rgba(0,0,0,.08);border:2px solid #f0ece4;text-align:center;}
.summary-card.show{display:block;animation:fadeUp .4s ease;}
.sum-emoji{font-size:56px;margin-bottom:10px;animation:bop 2s ease-in-out infinite;}
.sum-title{font-size:18px;font-weight:900;margin-bottom:8px;}
.sum-sub{font-size:14px;color:#aaa;font-weight:700;line-height:1.6;}
.sum-ans{background:var(--p2);border-radius:12px;padding:12px 14px;margin:14px 0;text-align:left;}
.sum-ans-item{font-size:13px;font-weight:700;line-height:1.8;color:#5e35b1;}
.sum-ans-item b{color:var(--p);font-weight:900;}

/* Teacher mode */
.teacher-wrap{display:none;padding:16px;}
.teacher-wrap.show{display:block;}
.t-title{font-size:18px;font-weight:900;margin-bottom:4px;}
.t-sub{font-size:13px;color:#aaa;font-weight:700;margin-bottom:16px;}
.t-group-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px;}
.t-tab{padding:7px 12px;border-radius:20px;font-family:inherit;font-size:13px;font-weight:900;cursor:pointer;border:2px solid #e8e4dc;background:#fff;color:#aaa;flex-shrink:0;transition:all .18s;}
.t-tab.sel{border-color:var(--p);background:var(--p2);color:var(--p);}
.t-answer-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 12px rgba(0,0,0,.07);border:2px solid #f0ece4;margin-bottom:10px;}
.t-answer-q{font-size:11px;font-weight:900;color:#ab47bc;margin-bottom:5px;}
.t-answer-text{font-size:14px;font-weight:700;line-height:1.6;color:var(--text);}
.t-empty{text-align:center;color:#bbb;font-size:14px;font-weight:700;padding:20px;}
.reload-btn{width:100%;margin-top:10px;padding:13px;border:none;border-radius:14px;font-family:inherit;font-size:14px;font-weight:900;cursor:pointer;background:#f0ece4;color:#888;transition:all .2s;}
.mode-switch{position:fixed;bottom:20px;right:16px;background:rgba(123,47,190,.9);color:#fff;border:none;border-radius:20px;padding:10px 16px;font-family:inherit;font-size:12px;font-weight:900;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.2);backdrop-filter:blur(4px);z-index:100;}
.group-badge{display:inline-block;background:var(--p);color:#fff;font-size:13px;font-weight:900;padding:4px 12px;border-radius:20px;margin-bottom:14px;}
</style>
</head>
<body>

<div class="hero">
  <span class="hero-emoji">🤖</span>
  <h1>⑨労働災害の防止<br>グループ討論</h1>
  <div class="hero-sub">AIとロボットが仕事の安全をどう変える？</div>
</div>

<!-- Group Select -->
<div class="setup-wrap" id="setupWrap">
  <div class="setup-card">
    <div class="setup-label">STEP 1</div>
    <div class="setup-title">あなたのグループ番号を選んでください</div>
    <div class="group-grid" id="groupGrid">
      <button class="group-btn" onclick="selGroup(1)">G1</button>
      <button class="group-btn" onclick="selGroup(2)">G2</button>
      <button class="group-btn" onclick="selGroup(3)">G3</button>
      <button class="group-btn" onclick="selGroup(4)">G4</button>
      <button class="group-btn" onclick="selGroup(5)">G5</button>
      <button class="group-btn" onclick="selGroup(6)">G6</button>
      <button class="group-btn" onclick="selGroup(7)">G7</button>
      <button class="group-btn" onclick="selGroup(8)">G8</button>
      <button class="group-btn" onclick="selGroup(9)">G9</button>
    </div>
    <button class="start-btn" id="startBtn" onclick="startDiscuss()">💬 討論をはじめる</button>
  </div>
</div>

<!-- Discussion -->
<div class="discuss-wrap" id="discussWrap">
  <div class="group-badge" id="groupBadge">G? グループ</div>
  <div class="step-nav" id="stepNav"></div>
  <div id="cardArea"></div>
</div>

<!-- Teacher mode -->
<div class="teacher-wrap" id="teacherWrap">
  <div class="t-title">📋 グループ回答一覧</div>
  <div class="t-sub">⑨労働災害の防止 ── グループ討論</div>
  <div class="t-group-tabs" id="tGroupTabs">
    <button class="t-tab sel" onclick="selTeacherGroup('all')">全グループ</button>
    <button class="t-tab" onclick="selTeacherGroup('g1')">G1</button>
    <button class="t-tab" onclick="selTeacherGroup('g2')">G2</button>
    <button class="t-tab" onclick="selTeacherGroup('g3')">G3</button>
    <button class="t-tab" onclick="selTeacherGroup('g4')">G4</button>
    <button class="t-tab" onclick="selTeacherGroup('g5')">G5</button>
    <button class="t-tab" onclick="selTeacherGroup('g6')">G6</button>
    <button class="t-tab" onclick="selTeacherGroup('g7')">G7</button>
    <button class="t-tab" onclick="selTeacherGroup('g8')">G8</button>
    <button class="t-tab" onclick="selTeacherGroup('g9')">G9</button>
  </div>
  <div id="tAnswerArea"><div class="t-empty">読み込み中...</div></div>
  <button class="reload-btn" onclick="loadTeacherData()">🔄 最新データを取得</button>
</div>

<button class="mode-switch" id="modeSwitchBtn" onclick="toggleMode()">🔐 先生</button>

<script>
const FIREBASE_URL = 'https://hoken-app-26315-default-rtdb.firebaseio.com';
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwAS_zQlCKw8_DlGe4ltijzRjQ3UrEbgbSK5jdq7lvS_SgmB4nOdVzsBRTuhV7iQ5hi/exec';

const STEPS = [
  {
    id: 'q1',
    q: '🤖 AIやロボットが工場・建設現場などで働くと、労働災害は減ると思いますか？',
    hint: '📌 ヒント: 危険な作業を機械に任せると…？ ロボットが疲れないと…？ どんな事故が減りそう？',
    placeholder: 'グループの意見をまとめて書いてください（例：危険な作業をロボットが代わりにやることで、転落や挟まれ事故が減ると思う）'
  },
  {
    id: 'q2',
    q: '⚠️ 逆に、AIやロボットの導入で新しい危険（事故リスク）が生まれることはありますか？',
    hint: '📌 ヒント: 機械の誤作動・人間とロボットの協働・プログラムミスなど、新しいリスクについて考えよう',
    placeholder: 'グループで話し合った意見を書いてください（例：ロボットが予期しない動きをして人にぶつかる危険がある）'
  },
  {
    id: 'q3',
    q: '🏥 メンタルヘルス（過労・ストレス）の問題も、AIで解決できると思いますか？',
    hint: '📌 ヒント: AIが仕事量を管理してくれたら？ でも監視が強くなったら？ 人との関係はどうなる？',
    placeholder: 'グループの考えを書いてください（例：AIが労働時間を管理してくれれば残業が減るかもしれないが、監視される不安もある）'
  },
  {
    id: 'q4',
    q: '💡 AI・ロボット時代の労働災害を防ぐために、どんなルールや対策が必要だと思いますか？',
    hint: '📌 ヒント: 法律・訓練・設計・労働者の権利など、どんな仕組みが必要か考えよう',
    placeholder: 'グループのアイデアを書いてください（例：ロボットと人が一緒に働くエリアには安全センサーを義務づけるべき）'
  }
];

let selectedGroup = null;
let currentStep = 0;
let answers = {};
let teacherMode = false;
let teacherUnlocked = false;
let teacherGroupFilter = 'all';
let teacherData = null;

// ── Group Select ─────────────────────────────────────────
function selGroup(n){
  selectedGroup = n;
  document.querySelectorAll('.group-btn').forEach((b,i)=>{
    b.classList.toggle('sel', i+1 === n);
  });
  document.getElementById('startBtn').classList.add('active');
}

function startDiscuss(){
  if(!selectedGroup) return;
  document.getElementById('setupWrap').style.display = 'none';
  document.getElementById('discussWrap').style.display = 'block';
  document.getElementById('groupBadge').textContent = 'G' + selectedGroup + ' グループ';

  // Check saved progress
  const saved = localStorage.getItem('discuss9_g' + selectedGroup);
  if(saved){
    try{ answers = JSON.parse(saved); }catch(e){ answers = {}; }
  }
  currentStep = Object.keys(answers).length;
  if(currentStep >= STEPS.length) currentStep = STEPS.length;

  renderNav();
  if(currentStep >= STEPS.length){ showSummary(); }
  else{ showStep(currentStep); }
}

// ── Navigation ───────────────────────────────────────────
function renderNav(){
  const nav = document.getElementById('stepNav');
  nav.innerHTML = STEPS.map((s,i)=>{
    let cls = 'step-dot';
    if(i < currentStep) cls += ' done';
    else if(i === currentStep) cls += ' active';
    return `<div class="${cls}" onclick="jumpStep(${i})">${i+1}</div>`;
  }).join('') + `<div class="step-dot ${currentStep>=STEPS.length?'done':''}" style="font-size:16px">✅</div>`;
}

function jumpStep(i){
  if(i <= currentStep){ currentStep = i; showStep(i); renderNav(); }
}

// ── Step ─────────────────────────────────────────────────
function showStep(i){
  const s = STEPS[i];
  const savedAns = answers[s.id] || '';
  document.getElementById('cardArea').innerHTML = `
    <div class="d-card show">
      <div class="d-num">ディスカッション ${i+1} / ${STEPS.length}</div>
      <div class="d-question">${s.q}</div>
      <div class="d-hint"><div class="d-hint-title">💡 考えるヒント</div>${s.hint}</div>
      <textarea id="ans${i}" placeholder="${s.placeholder}" maxlength="300" oninput="updateCount(${i})">${savedAns}</textarea>
      <div class="char-count" id="cnt${i}">${savedAns.length} / 300文字</div>
      <button class="next-btn" onclick="saveAndNext(${i})">${i<STEPS.length-1?'次のテーマへ ➡':'📤 まとめて送信する'}</button>
      <button class="skip-btn" onclick="skipStep(${i})">スキップ（後で書く）</button>
    </div>`;
}

function updateCount(i){
  const v = document.getElementById('ans'+i).value;
  document.getElementById('cnt'+i).textContent = v.length + ' / 300文字';
}

function saveAndNext(i){
  const val = document.getElementById('ans'+i).value.trim();
  answers[STEPS[i].id] = val;
  localStorage.setItem('discuss9_g' + selectedGroup, JSON.stringify(answers));
  currentStep = Math.max(currentStep, i+1);
  renderNav();
  if(i < STEPS.length-1){ showStep(i+1); }
  else{ submitAll(); }
}

function skipStep(i){
  answers[STEPS[i].id] = '';
  currentStep = Math.max(currentStep, i+1);
  renderNav();
  if(i < STEPS.length-1){ showStep(i+1); }
  else{ submitAll(); }
}

// ── Submit ───────────────────────────────────────────────
async function submitAll(){
  const payload = {
    group: 'g' + selectedGroup,
    answers: answers,
    ts: new Date().toISOString()
  };

  let ok = false;
  try {
    const res = await fetch(`${FIREBASE_URL}/discuss9/g${selectedGroup}.json`,{
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(res.ok) ok = true;
  } catch(e){}

  if(!ok){
    try{
      const qs = Object.entries(answers).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
      await fetch(GAS_URL+'?sheet=discuss9&group=g'+selectedGroup+'&ts='+encodeURIComponent(payload.ts)+'&'+qs);
      ok = true;
    }catch(e){}
  }
  showSummary(ok);
}

function showSummary(ok){
  document.getElementById('cardArea').innerHTML = `
    <div class="summary-card show">
      <div class="sum-emoji">🎉</div>
      <div class="sum-title">${ok===false?'⚠ 送信エラー（ローカル保存済み）':'討論おつかれさまでした！'}</div>
      <div class="sum-sub">G${selectedGroup}グループの意見を記録しました。<br>先生の合図があるまで待ってください。</div>
      <div class="sum-ans">
        ${STEPS.map((s,i)=>`<div class="sum-ans-item"><b>Q${i+1}</b> ${s.q.replace(/^[^\s]+ /,'').slice(0,30)}…<br>${answers[s.id]||'（未回答）'}</div>`).join('')}
      </div>
    </div>`;
  document.getElementById('stepNav').style.display = 'none';
}

// ── Teacher ──────────────────────────────────────────────
function toggleMode(){
  if(!teacherUnlocked){
    const pw = prompt('先生用パスワードを入力してください');
    if(pw !== 'sensei2025') return;
    teacherUnlocked = true;
  }
  teacherMode = !teacherMode;
  document.getElementById('setupWrap').style.display = teacherMode ? 'none' : '';
  document.getElementById('discussWrap').style.display = 'none';
  const tw = document.getElementById('teacherWrap');
  tw.classList.toggle('show', teacherMode);
  document.getElementById('modeSwitchBtn').textContent = teacherMode ? '👩‍🎓 生徒' : '🔐 先生';
  if(teacherMode) loadTeacherData();
}

async function loadTeacherData(){
  document.getElementById('tAnswerArea').innerHTML = '<div class="t-empty">読み込み中...</div>';
  try {
    const res = await fetch(`${FIREBASE_URL}/discuss9.json`);
    teacherData = await res.json();
    renderTeacher();
  } catch(e){
    document.getElementById('tAnswerArea').innerHTML = '<div class="t-empty">データ取得エラー</div>';
  }
}

function selTeacherGroup(g){
  teacherGroupFilter = g;
  document.querySelectorAll('.t-tab').forEach(t=>{
    t.classList.toggle('sel', t.textContent.toLowerCase().replace(' ','') === g || (g==='all' && t.textContent==='全グループ'));
  });
  renderTeacher();
}

function renderTeacher(){
  const area = document.getElementById('tAnswerArea');
  if(!teacherData){ area.innerHTML='<div class="t-empty">データなし</div>'; return; }
  const groups = teacherGroupFilter === 'all'
    ? Object.keys(teacherData)
    : [teacherGroupFilter].filter(k=>teacherData[k]);
  if(!groups.length){ area.innerHTML='<div class="t-empty">回答がまだありません</div>'; return; }
  area.innerHTML = groups.map(gk=>{
    const rec = teacherData[gk];
    if(!rec || !rec.answers) return '';
    const groupNum = gk.replace('g','');
    return `<div class="t-answer-card">
      <div class="t-answer-q" style="font-size:14px;font-weight:900;color:var(--p);margin-bottom:8px">📌 G${groupNum}グループ</div>
      ${STEPS.map((s,i)=>`
        <div style="margin-bottom:8px">
          <div class="t-answer-q">Q${i+1} ${s.q.replace(/^[^\s]+ /,'').slice(0,40)}…</div>
          <div class="t-answer-text">${rec.answers[s.id]||'（未回答）'}</div>
        </div>`).join('')}
    </div>`;
  }).join('');
}
</script>
</body>
</html>
